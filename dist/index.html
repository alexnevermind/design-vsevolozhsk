<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Участок во Всеволожске — 3D</title>
<meta name="description" content="Интерактивный 3D-участок: гостевой дом-баня, гриль-дом, хоз.блок с навесом, деревья по плану, рельеф, солнце и тени, прогулка.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./site.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app" class="mode-site">
  <canvas id="scene" aria-label="Трёхмерная сцена участка" tabindex="0"></canvas>

  <header class="topbar ui">
    <div class="brand" aria-label="Участок во Всеволожске">
      <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-5.6H9.2V21H4a1 1 0 0 1-1-1z"/></svg>
      <div class="brand-text"><strong>Участок · Всеволожск</strong><span id="place-label">≈12 соток · три постройки</span></div>
    </div>
    <nav class="modes" role="tablist" aria-label="Режим просмотра">
      <button role="tab" data-mode="site" aria-selected="true">Участок</button>
      <button role="tab" data-mode="interior" aria-selected="false" disabled title="Интерьеры — следующий этап">Внутри</button>
      <button role="tab" data-mode="walk" aria-selected="false">Прогулка</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="btn-sun" title="Солнце и время" aria-label="Солнце и время"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      <button class="icon-btn" id="btn-png" title="Сохранить кадр PNG" aria-label="Сохранить кадр PNG"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6l1.4-2.2h4.2L15.5 6"/></svg></button>
      <button class="icon-btn" id="btn-link" title="Ссылка на вид" aria-label="Ссылка на вид"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button class="icon-btn" id="btn-settings" title="Качество изображения" aria-label="Качество изображения"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg></button>
      <button class="icon-btn" id="btn-help" title="Справка" aria-label="Справка"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6M12 17.2h.01"/></svg></button>
    </div>
  </header>

  <aside class="side-panel ui site-panel" id="side-panel" aria-label="Постройки">
    <button class="sheet-toggle" id="sheet-toggle" aria-expanded="true" aria-controls="side-body">Постройки</button>
    <div class="side-body" id="side-body"></div>
  </aside>

  <div class="cam-controls ui" aria-label="Камера">
    <div class="btn-group">
      <button class="icon-btn" id="btn-zoom-in" title="Приблизить" aria-label="Приблизить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="btn-zoom-out" title="Отдалить" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="icon-btn" id="btn-reset" title="Общий вид (R)" aria-label="Общий вид"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></button>
      <button class="icon-btn" id="btn-top" title="Вид сверху (T)" aria-label="Вид сверху"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h9V4M13 12v8"/></svg></button>
      <button class="icon-btn" id="btn-cinema" title="Облёт (C)" aria-label="Облёт"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="1.5"/><path d="m16 10.5 5-3v9l-5-3"/></svg></button>
      <button class="icon-btn" id="btn-hide" title="Скрыть интерфейс (/)" aria-label="Скрыть интерфейс"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></svg></button>
    </div>
  </div>

  <div class="popover ui" id="sun-panel" hidden role="dialog" aria-label="Солнце">
    <div class="pop-head"><strong>Солнце · Всеволожск</strong><button class="icon-btn small" data-close="sun-panel" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sun-readout" id="sun-readout"></div>
    <label class="field">Время <output id="sun-time-out">11:00</output><input type="range" id="sun-time" min="0" max="1439" step="1"></label>
    <div class="row2">
      <label class="field">Дата<input type="date" id="sun-date"></label>
      <label class="check"><input type="checkbox" id="sun-notes"> Траектория (N)</label>
    </div>
    <div class="row2">
      <label class="check"><input type="checkbox" id="sun-lamps"> Светильники</label>
      <label class="field">Костёр<select id="sun-fire"><option value="auto">Авто: вечером и ночью</option><option value="on">Горит</option><option value="off">Погашен</option></select></label>
    </div>
    <div class="previews" id="sun-previews"></div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="pop-head"><strong id="modal-title"></strong><button class="icon-btn small" id="modal-close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="walk-hud" id="walk-hud" hidden>
    <div class="walk-top ui-walk">
      <button id="walk-pause">Пауза</button>
      <button id="walk-exit">Вернуться к обзору</button>
    </div>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="walk-info" id="walk-info"></div>
    <div class="walk-paused" id="walk-paused" hidden>
      <p><strong>Прогулка на паузе</strong></p>
      <p>WASD / стрелки — движение, Shift — быстрее, мышь — взгляд, Esc — пауза.</p>
      <button id="walk-resume">Продолжить</button>
    </div>
    <div class="joystick" id="joystick" aria-label="Джойстик движения"><div class="stick" id="stick"></div></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="loading" id="loading"><div class="spinner"></div><span>Загрузка участка…</span></div>
</div>
<script type="module" src="./site-app.js"></script>
</body>
</html>
